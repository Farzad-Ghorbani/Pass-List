name: Export Pass-List v1.13.2 offline bundle

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download v1.13.2-final \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pass-list-offline-images-v1.13.2-final.tar.gz*' \
            --dir out
          cd out
          sha256sum -c pass-list-offline-images-v1.13.2-final.tar.gz.sha256
          test -s pass-list-offline-images-v1.13.2-final.tar.gz
      - name: Upload temporary ChatGPT download artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass-list-v1.13.2-final-offline-bundle
          path: out/
          if-no-files-found: error
          retention-days: 3
