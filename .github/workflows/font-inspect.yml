name: Temporary Pass-List font inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct checksum-verified source
        run: python tools/graphify/prepare_source.py
      - name: Locate reference and admin typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("graphify-source")
          exts = {".css", ".scss", ".sass", ".html", ".htm", ".js"}
          files = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in exts)
          print(f"FRONTEND_FILES={len(files)}")
          print("=== FILE LIST ===")
          for p in files:
              print(p.relative_to(root))
          pattern = re.compile(r"font-family|font-weight|@font-face|Home|User Units|Fields\s*&\s*Dropdowns|Security Timeouts|TLS Certificate", re.I)
          print("=== TYPOGRAPHY / REFERENCE MATCHES ===")
          total = 0
          for p in files:
              try:
                  lines = p.read_text(encoding="utf-8").splitlines()
              except Exception:
                  continue
              hits = [i for i, line in enumerate(lines) if pattern.search(line)]
              if not hits:
                  continue
              print(f"--- {p.relative_to(root)} ({len(hits)} matches) ---")
              shown = set()
              for i in hits:
                  for j in range(max(0, i-2), min(len(lines), i+3)):
                      if j not in shown:
                          print(f"{j+1}: {lines[j][:500]}")
                          shown.add(j)
                          total += 1
                          if total >= 1200:
                              print("OUTPUT_TRUNCATED")
                              raise SystemExit(0)
          print(f"TOTAL_CONTEXT_LINES={total}")
          PY
