name: Build and publish Pass-List images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'source/BUILD-SHA256.txt'
      - '.github/workflows/publish-images.yml'

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: v1.13.1-final

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify build source
        shell: bash
        run: |
          set -euo pipefail
          cat source/parts/part-*.b64 | base64 -d > pass-list-v1.13.1-final-source.zip
          EXPECTED="$(tr -d '[:space:]' < source/BUILD-SHA256.txt)"
          ACTUAL="$(sha256sum pass-list-v1.13.1-final-source.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf build-source
          mkdir -p build-source
          unzip -q pass-list-v1.13.1-final-source.zip -d build-source
          mv build-source/pass-list-v1.13.1-final-source build-source/src
          echo "Source SHA256 verified: $ACTUAL"

      - name: Set image names
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=ghcr.io/$OWNER" >> "$GITHUB_ENV"

      - name: Build Web image
        shell: bash
        run: |
          docker build             --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"             -t "$IMAGE_PREFIX/pass-list-web:$RELEASE_TAG"             build-source/src/app

      - name: Run application tests
        shell: bash
        run: |
          set -euo pipefail
          docker network create passlist-ci
          docker run -d --name passlist-ci-db --network passlist-ci             -e POSTGRES_DB=passlist_test             -e POSTGRES_USER=passlist_test             -e POSTGRES_PASSWORD=passlist_test_password             postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec passlist-ci-db pg_isready -U passlist_test -d passlist_test >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec passlist-ci-db pg_isready -U passlist_test -d passlist_test
          docker run --rm --network passlist-ci             -e DJANGO_SECRET_KEY=ci-only-secret-key-not-for-production             -e DJANGO_ALLOWED_HOSTS=testserver,localhost,127.0.0.1             -e POSTGRES_DB=passlist_test             -e POSTGRES_USER=passlist_test             -e POSTGRES_PASSWORD=passlist_test_password             -e POSTGRES_HOST=passlist-ci-db             -e POSTGRES_PORT=5432             -e PASSLIST_ENCRYPTION_KEY=OX1vA6YplXMr2t-gTxomzhSN81biW1q8D4q5K1KednI=             -e PASSLIST_OPS_TOKEN=ci-only-ops-token             --entrypoint sh             "$IMAGE_PREFIX/pass-list-web:$RELEASE_TAG"             -c 'python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test --noinput'
          docker rm -f passlist-ci-db
          docker network rm passlist-ci

      - name: Build supporting images
        shell: bash
        run: |
          set -euo pipefail
          docker build             --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"             -f build-source/src/docker/cert-ops/Dockerfile             -t "$IMAGE_PREFIX/pass-list-cert-ops:$RELEASE_TAG"             build-source/src
          docker build             --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"             -f build-source/src/docker/nginx/Dockerfile             -t "$IMAGE_PREFIX/pass-list-nginx:$RELEASE_TAG"             build-source/src
          docker build             --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"             -f build-source/src/docker/init/Dockerfile             -t "$IMAGE_PREFIX/pass-list-init:$RELEASE_TAG"             build-source/src
          docker pull postgres:16-alpine
          docker tag postgres:16-alpine "$IMAGE_PREFIX/pass-list-postgres:16-alpine"

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push images
        shell: bash
        run: |
          set -euo pipefail
          for image in             pass-list-web:$RELEASE_TAG             pass-list-cert-ops:$RELEASE_TAG             pass-list-nginx:$RELEASE_TAG             pass-list-init:$RELEASE_TAG             pass-list-postgres:16-alpine
          do
            docker push "$IMAGE_PREFIX/$image"
          done

      - name: Build offline image bundle
        shell: bash
        run: |
          set -euo pipefail
          docker save             "$IMAGE_PREFIX/pass-list-web:$RELEASE_TAG"             "$IMAGE_PREFIX/pass-list-cert-ops:$RELEASE_TAG"             "$IMAGE_PREFIX/pass-list-nginx:$RELEASE_TAG"             "$IMAGE_PREFIX/pass-list-init:$RELEASE_TAG"             "$IMAGE_PREFIX/pass-list-postgres:16-alpine"             | gzip -1 > "pass-list-offline-images-$RELEASE_TAG.tar.gz"
          sha256sum "pass-list-offline-images-$RELEASE_TAG.tar.gz" > "pass-list-offline-images-$RELEASE_TAG.tar.gz.sha256"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --repo "$GITHUB_REPOSITORY"               --title "Pass-List $RELEASE_TAG"               --notes "Image-based Pass-List deployment. Includes GHCR images and an offline Docker image bundle."
          fi
          gh release upload "$RELEASE_TAG"             "pass-list-offline-images-$RELEASE_TAG.tar.gz"             "pass-list-offline-images-$RELEASE_TAG.tar.gz.sha256"             --repo "$GITHUB_REPOSITORY"             --clobber
