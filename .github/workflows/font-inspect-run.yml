name: Temporary Pass-List archive inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/font-inspect-run.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source archive members
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zipfile, io, hashlib
          parts = sorted(Path("source/parts").glob("part-*.b64"))
          data = base64.b64decode(b"".join(b"".join(p.read_bytes().split()) for p in parts), validate=True)
          print("SHA256", hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist()[:25]:
                  print(repr(name))
          PY
